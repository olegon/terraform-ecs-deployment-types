name: Reusable - Build Docker image and deploy to Amazon ECS

permissions:
  id-token: write
  contents: read

on:
  workflow_call:
    inputs:
      app-path:
        required: true
        type: string
      aws-region:
        required: true
        type: string
      codedeploy-application-name:
        required: true
        type: string
      codedeploy-deployment-group-name:
        required: true
        type: string
      container-name:
        required: true
        type: string
      container-port:
        required: true
        type: number
      ecr-repository-name:
        required: true
        type: string
      ecs-cluster-name:
        required: true
        type: string
      ecs-service-name:
        required: true
        type: string
      ecs-task-definition-file:
        required: false
        type: string
        default: task-definition.json
      synthetic-test-lambda-arn:
        required: false
        type: string
        default: ""
    secrets:
      AWS_IAM_ROLE_ARN:
        required: true
  
env:
  CONTAINER_NAME: ${{ inputs.container-name }}
  CONTAINER_PORT: ${{ inputs.container-port }}
  ECR_REPOSITORY_NAME: ${{ inputs.ecr-repository-name }}
  ECS_SERVICE_NAME: ${{ inputs.ecs-service-name }}
  ECS_TASK_DEFINITION_FILE: ${{ inputs.ecs-task-definition-file }}

jobs:
  app-build-and-publish:
    name: App - Build and publish
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Github -> Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        working-directory: ${{ inputs.app-path }}
        run: |
          # Build a docker container and
          # push it to ECR so that it can
          # be deployed to ECS.
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_NAME:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_NAME:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY_NAME:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Get task definition
        id: get-task-definition
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_SERVICE_NAME" \
            --query taskDefinition > "$ECS_TASK_DEFINITION_FILE"

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION_FILE }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Print task definition
        id: print-task-definition
        env:
          TASK_DEFINITION_PATH: ${{ steps.task-def.outputs.task-definition }}
        run: |
          cat "$TASK_DEFINITION_PATH"

      - name: Create appspec file
        id: create-appspec-file
        env:
          SYNTHETIC_TEST_LAMBDA_ARN: ${{ inputs.synthetic-test-lambda-arn }}
        run: |
          set -euo pipefail

          if [ -n "$SYNTHETIC_TEST_LAMBDA_ARN" ]; then
            envsubst < .github/appspec-templates/appspec-with-hook.json.tpl > appspec.json
          else
            envsubst < .github/appspec-templates/appspec-no-hook.json.tpl > appspec.json
          fi

          cat appspec.json

      - name: Validate appspec JSON
        run: |
          echo "--- appspec.json contents ---"
          sed -n '1,200p' appspec.json
          echo "--- validating JSON ---"
          python - <<'PY'
import sys, json
try:
    json.load(open('appspec.json'))
    print('appspec.json is valid JSON')
except Exception as e:
    print('appspec.json is invalid JSON:', e)
    raise SystemExit(1)
PY

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_NAME }}
          cluster: ${{ inputs.ecs-cluster-name }}
          wait-for-service-stability: true
          codedeploy-appspec: appspec.json
          codedeploy-application: ${{ inputs.codedeploy-application-name }}
          codedeploy-deployment-group: ${{ inputs.codedeploy-deployment-group-name }}
