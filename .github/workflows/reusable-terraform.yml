name: Reusable - Terraform plan & apply

permissions:
  id-token: write
  contents: read

on:
  workflow_call:
    inputs:
      aws-region:
        required: true
        type: string
      terraform-directory-path:
        required: true
        type: string
      terraform-version:
        required: false
        type: string
        default: 1.14.0
    outputs:
      synthetic_test_lambda_arn:
        description: "ARN of synthetic test Lambda created during apply (if any)"
        value: ${{ jobs.terraform-apply.outputs.synthetic_test_lambda_arn }}
    secrets:
      AWS_IAM_ROLE_ARN:
        required: true


jobs:
  terraform-plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Terraform setup
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform-version }}

      - name: Terraform init
        working-directory: ${{ inputs.terraform-directory-path }}
        run: |
          terraform init

      - name: Terraform validate
        working-directory: ${{ inputs.terraform-directory-path }}
        run: |
          terraform validate -no-color

      - name: Terraform plan
        working-directory: ${{ inputs.terraform-directory-path }}
        run: |
          terraform plan -no-color


  terraform-apply:
    name: Terraform apply
    needs:
      - terraform-plan
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Terraform setup
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform-version }}

      - name: Terraform init
        working-directory: ${{ inputs.terraform-directory-path }}
        run: |
          terraform init

      - name: Terraform apply
        working-directory: ${{ inputs.terraform-directory-path }}
        run: |
          terraform apply -no-color -auto-approve

      - name: Export terraform outputs
        id: export
        working-directory: ${{ inputs.terraform-directory-path }}
        run: |
          # Try to export synthetic_test_lambda_arn robustly (suppress warnings like 'No outputs found')
          tfjson=$(terraform output -json 2>/dev/null || echo '{}')
          synthetic_test_lambda_arn=$(echo "$tfjson" | jq -r '.synthetic_test_lambda_arn.value // ""')
          echo "synthetic_test_lambda_arn=$synthetic_test_lambda_arn" >> $GITHUB_OUTPUT

    outputs:
      synthetic_test_lambda_arn: ${{ steps.export.outputs.synthetic_test_lambda_arn }}
